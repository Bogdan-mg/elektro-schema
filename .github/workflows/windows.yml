name: Windows-programma bouwen

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  bouwen:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci
      - run: npm test

      - name: Installatiebestand maken
        run: npm run dist
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'

      - uses: actions/upload-artifact@v4
        with:
          name: Elektro-Schema-Setup
          path: dist/*.exe
          if-no-files-found: error

      # Elke versie op main komt ook onder de release "laatste", met een vaste downloadlink.
      - name: Release "laatste" bijwerken
        if: github.ref == 'refs/heads/main'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete laatste --yes --cleanup-tag || true
          gh release create laatste dist/*.exe --prerelease --target "$GITHUB_SHA" \
            --title "Elektro Schema (laatste versie)" \
            --notes "Installatiebestand voor Windows, automatisch gemaakt van de laatste versie op main."

      - name: Release voor een versie
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" dist/*.exe --title "Elektro Schema $GITHUB_REF_NAME" \
            --notes "Installatiebestand voor Windows."
